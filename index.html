<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室桌遊與卡牌檢索系統</title>
    <!-- Tailwind CSS (負責畫面樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons (負責圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="text-slate-800 p-4 sm:p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-dice-d20 text-indigo-600"></i>
                    辦公室桌遊與卡牌檢索系統
                </h1>
                <p class="text-xs text-slate-500 mt-1">輕鬆尋找桌遊與牌卡放置位置（點擊卡片可查看櫃位地圖）</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openAddModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增桌遊
                </button>
                <button onclick="loadData()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i id="refreshIcon" class="fa-solid fa-rotate"></i> 重新整理
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-6">
            <input type="text" id="searchInput" oninput="filterGames()" placeholder="搜尋桌遊名稱或位置（如：A1、B2）..." class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        </div>

        <!-- Data Grid & Loading -->
        <div id="loading" class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-600"></i>
            <p class="text-sm">載入雲端試算表資料中...</p>
        </div>
        
        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 1. 櫃位示意圖 Modal -->
    <div id="mapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div>
                    <h2 id="modalGameName" class="text-xl font-bold text-slate-800">--</h2>
                    <p class="text-xs text-slate-500">試算表登記位置：<span id="modalGameLocation" class="font-bold text-indigo-600">--</span></p>
                </div>
                <button onclick="closeMapModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
            </div>

            <!-- 櫃子示意圖 -->
            <div class="border-4 border-slate-800 bg-slate-300 p-2 rounded-lg grid grid-cols-4 gap-1 text-center font-bold">
                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-r-2 border-slate-400 text-xs">其他區</div>
                
                <div class="col-span-2 grid grid-rows-2 gap-1 h-32">
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A1" class="bg-white flex flex-col items-center justify-center rounded">A1</div>
                        <div id="loc-B1" class="bg-white flex flex-col items-center justify-center rounded">B1</div>
                    </div>
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A2" class="bg-white flex flex-col items-center justify-center rounded">A2</div>
                        <div id="loc-B2" class="bg-white flex flex-col items-center justify-center rounded">B2</div>
                    </div>
                </div>

                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-l-2 border-slate-400 text-xs">其他區</div>
            </div>

            <div class="mt-5 text-center">
                <button onclick="closeMapModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-700">關閉示意圖</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增桌遊 Modal -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h2 class="text-xl font-bold text-slate-800">新增桌遊 / 牌卡</h2>
                <button onclick="closeAddModal()" class="text-slate-400 text-xl">&times;</button>
            </div>
            <form onsubmit="submitNewGame(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">名稱 *</label>
                    <input type="text" id="addName" required class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">位置 (如：A1、B2) *</label>
                    <input type="text" id="addLoc" required class="w-full p-2 border rounded text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded text-sm">取消</button>
                    <button type="submit" id="btnSubmit" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm">確認新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 (完全無 Vue 衝突) -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwtas6wDz1YWgfQ0nDI3D6aJf2x5Pt5eFvYSyxDIMf4MEZqn1eLH4akAodhRHPqzHSItA/exec';
        let allGames = [];

        async function loadData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('gamesGrid').innerHTML = '';
            document.getElementById('refreshIcon').classList.add('fa-spin');

            try {
                const res = await fetch(API_URL);
                allGames = await res.json();
                renderCards(allGames);
            } catch (err) {
                console.error('Data Error:', err);
                alert('資料載入失敗！');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('refreshIcon').classList.remove('fa-spin');
            }
        }

        function renderCards(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            games.forEach(game => {
                // 相容大小寫與不同命名
                const name = game.name || game.Name || '未命名桌遊';
                const location = game.location || game.Location || '未標示';
                const players = game.players || game.Players || '';
                const duration = game.duration || game.Duration || '';
                const notes = game.notes || game.Notes || '';
                const imageUrl = game.imageUrl || game.ImageUrl || game.image || '';

                // 解析標籤 (支援陣列或逗號字串)
                const parseTags = (val) => {
                    if (!val) return [];
                    if (Array.isArray(val)) return val;
                    return String(val).split(',').map(s => s.trim()).filter(Boolean);
                };

                const bgTags = parseTags(game.boardgameCategories || game.boardGameCategories);
                const cardTags = parseTags(game.cardCategories || game.cardCategory);

                // 桌遊類別 HTML
                const bgCatHtml = bgTags.length ? `
                    <div class="mb-3">
                        <span class="text-[11px] font-semibold text-slate-400 block mb-1">桌遊類別</span>
                        <div class="flex flex-wrap gap-1">
                            ${bgTags.map(t => `<span class="px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-md text-xs font-medium">${t}</span>`).join('')}
                        </div>
                    </div>` : '';

                // 牌卡類別 HTML
                const cardCatHtml = cardTags.length ? `
                    <div class="mb-3">
                        <span class="text-[11px] font-semibold text-slate-400 block mb-1">牌卡類別</span>
                        <div class="flex flex-wrap gap-1">
                            ${cardTags.map(t => `<span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-md text-xs font-medium">${t}</span>`).join('')}
                        </div>
                    </div>` : '';

                // 圖片 HTML (無圖片時顯示「無提供外盒照片」灰底區塊)
                const imageArea = imageUrl ? 
                    `<img src="${imageUrl}" alt="${name}" class="w-full h-44 object-cover">` : 
                    `<div class="w-full h-44 bg-slate-100/80 flex flex-col items-center justify-center text-slate-400">
                        <i class="fa-solid fa-image text-3xl mb-1 text-slate-300"></i>
                        <span class="text-xs font-medium">無提供外盒照片</span>
                     </div>`;

                // 備註 HTML
                const notesArea = notes ? 
                    `<div class="px-5 py-3 bg-slate-50/80 border-t border-slate-100 text-xs text-slate-500 flex items-start gap-1.5">
                        <i class="fa-solid fa-circle-info text-slate-400 mt-0.5"></i> <span>${notes}</span>
                     </div>` : '';

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-slate-300 transition-all overflow-hidden cursor-pointer flex flex-col justify-between group";
                
                card.innerHTML = `
                    <div>
                        <!-- 圖片與位置標籤 -->
                        <div class="relative">
                            ${imageArea}
                            <span class="absolute top-3 right-3 px-2.5 py-1 bg-white/90 backdrop-blur-sm text-amber-800 border border-amber-200 rounded-md text-xs font-bold shadow-sm flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-amber-600"></i> ${location}
                            </span>
                        </div>

                        <!-- 內容區域 -->
                        <div class="p-5">
                            <h3 class="font-bold text-slate-900 text-lg mb-2">
                                ${name}
                            </h3>

                            <!-- 人數與時間 -->
                            <div class="flex items-center gap-3 text-xs text-slate-500 mb-4 pb-3 border-b border-slate-100">
                                ${players ? `<span class="flex items-center gap-1"><i class="fa-solid fa-users text-slate-400"></i> ${players}</span>` : ''}
                                ${duration ? `<span class="flex items-center gap-1"><i class="fa-solid fa-clock text-slate-400"></i> ${duration}</span>` : ''}
                            </div>

                            ${bgCatHtml}
                            ${cardCatHtml}
                        </div>
                    </div>
                    ${notesArea}
                `;

                // 點擊觸發彈窗
                card.onclick = () => openMapModal(name, location);
                grid.appendChild(card);
            });
        }

        function openMapModal(name, location) {
            document.getElementById('modalGameName').textContent = name;
            document.getElementById('modalGameLocation').textContent = location || '未標示';

            const rawLoc = String(location || '').toUpperCase();
            ['A1', 'A2', 'B1', 'B2'].forEach(loc => {
                const el = document.getElementById(`loc-${loc}`);
                if (el) {
                    if (rawLoc.includes(loc)) {
                        el.className = "bg-amber-400 text-amber-950 font-bold border-2 border-amber-600 shadow-inner flex flex-col items-center justify-center rounded text-xs";
                        el.innerHTML = `${loc}<span class="text-[9px] bg-amber-600 text-white px-1.5 rounded mt-0.5">在這裡!</span>`;
                    } else {
                        el.className = "bg-white text-slate-700 flex items-center justify-center rounded";
                        el.innerHTML = loc;
                    }
                }
            });

            document.getElementById('mapModal').classList.remove('hidden');
        }

        function closeMapModal() {
            document.getElementById('mapModal').classList.add('hidden');
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allGames.filter(g => {
                const name = (g.name || g.Name || '').toLowerCase();
                const loc = (g.location || g.Location || '').toLowerCase();
                const notes = (g.notes || g.Notes || '').toLowerCase();
                return name.includes(query) || loc.includes(query) || notes.includes(query);
            });
            renderCards(filtered);
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        async function submitNewGame(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = '寫入中...';

            const payload = {
                name: document.getElementById('addName').value,
                location: document.getElementById('addLoc').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                alert('新增成功！');
                closeAddModal();
                loadData();
            } catch (err) {
                alert('新增失敗！');
            } finally {
                btn.disabled = false;
                btn.innerText = '確認新增';
            }
        }

        loadData();
    </script>
</body>
</html>
