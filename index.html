<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室桌遊與卡牌檢索系統</title>
    <!-- 樣式與圖示庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- 頁首 Title -->
        <header class="mb-8 border-b border-slate-200 pb-5 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 flex items-center gap-3">
                    <i class="fa-solid fa-dice-d20 text-indigo-600"></i>
                    辦公室桌遊與卡牌檢索系統
                </h1>
                <p class="text-slate-500 mt-1 text-sm">點選任意桌遊卡片，即可查看櫃子地圖</p>
            </div>
            <button onclick="fetchData()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-medium flex items-center gap-2">
                <i class="fa-solid fa-rotate" id="refresh-icon"></i> 重新整理
            </button>
        </header>

        <!-- 筆數 -->
        <p class="text-sm text-slate-500 mb-4">
            共找到 <span id="game-count" class="font-bold text-slate-800">0</span> 項目
        </p>

        <!-- 桌遊卡片清單容器 -->
        <div id="game-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>資料載入中...</p>
            </div>
        </div>
    </div>

    <!-- 🏢 櫃子位置地圖 Modal 視窗 (強制開啟/關閉) -->
    <div id="location-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 relative animate-fade-in">
            <!-- 關閉按鈕 -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- 標題與桌遊資訊 -->
            <div class="flex items-center gap-3 mb-6 pr-8">
                <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-dice-d20 text-2xl"></i>
                </div>
                <div>
                    <h2 id="modal-game-name" class="text-xl font-bold text-slate-900">桌遊名稱</h2>
                    <p class="text-sm text-slate-500">
                        放置位置：<span id="modal-game-location" class="font-bold text-amber-600 text-base">未標示</span>
                    </p>
                </div>
            </div>

            <!-- 櫃子地圖本體 -->
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-6">
                <p class="text-xs font-semibold text-slate-500 text-center mb-3 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-warehouse"></i> 櫃子位置示意圖
                </p>

                <div class="w-full flex h-48 border-4 border-black bg-white select-none overflow-hidden rounded-sm">
                    <!-- 左側灰格 -->
                    <div class="w-1/4 bg-slate-300 border-r-4 border-black flex">
                        <div class="w-1/2 border-r border-slate-400"></div>
                        <div class="w-1/2"></div>
                    </div>

                    <!-- 2x2 主體櫃位 -->
                    <div class="w-1/2 grid grid-cols-2 grid-rows-2">
                        <div id="box-A1" class="border-r border-b border-black flex flex-col items-center justify-center transition-all duration-300 font-bold">
                            <span class="text-xl">A1</span>
                        </div>
                        <div id="box-B1" class="border-b border-black flex flex-col items-center justify-center transition-all duration-300 font-bold">
                            <span class="text-xl">B1</span>
                        </div>
                        <div id="box-A2" class="border-r border-black flex flex-col items-center justify-center transition-all duration-300 font-bold">
                            <span class="text-xl">A2</span>
                        </div>
                        <div id="box-B2" class="flex flex-col items-center justify-center transition-all duration-300 font-bold">
                            <span class="text-xl">B2</span>
                        </div>
                    </div>

                    <!-- 右側灰格 -->
                    <div class="w-1/4 bg-slate-300 border-l-4 border-black flex">
                        <div class="w-1/2 border-r border-slate-400"></div>
                        <div class="w-1/2"></div>
                    </div>
                </div>
            </div>

            <div class="text-right">
                <button onclick="closeModal()" class="px-5 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg hover:bg-slate-900 transition-colors">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 原生 JavaScript 邏輯 (完全無框架依賴) -->
    <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxwTBOOFgBlIzJrM8burEMsd9qVYdXn1m2waXvp8Zqxat0raRKhHl2xn2ZqeAuYfp_kdg/exec';
    let gamesData = [];

    // 1. 抓取 Google Sheets 資料
    async function fetchData() {
        const grid = document.getElementById('game-grid');
        const refreshIcon = document.getElementById('refresh-icon');
        refreshIcon.classList.add('fa-spin');

        try {
            const response = await fetch(API_URL);
            gamesData = await response.json();
            renderGames(gamesData);
        } catch (error) {
            console.error('API Error:', error);
            grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">資料讀取失敗，請確認 API URL 是否正常。</div>`;
        } finally {
            refreshIcon.classList.remove('fa-spin');
        }
    }

    // 2. 動態渲染桌遊卡片 HTML
    function renderGames(games) {
        const grid = document.getElementById('game-grid');
        document.getElementById('game-count').innerText = games.length;

        if (!games || games.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">目前沒有桌遊資料</div>`;
            return;
        }

        grid.innerHTML = games.map((game, index) => {
            const loc = game.location || '未標示';
            const bgCats = (game.boardgameCategories || []).map(c => `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-xs">${c}</span>`).join('');
            const cardCats = (game.cardCategories || []).map(c => `<span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded text-xs">${c}</span>`).join('');

            return `
                <div onclick="openModal(${index})" class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-indigo-400 transition-all cursor-pointer overflow-hidden flex flex-col justify-between group">
                    <div>
                        <div class="w-full h-48 bg-slate-100 relative overflow-hidden flex items-center justify-center border-b border-slate-100">
                            ${game.imageUrl 
                                ? `<img src="${game.imageUrl}" alt="${game.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`
                                : `<div class="text-center text-slate-400 p-4"><i class="fa-solid fa-image text-3xl mb-1"></i><p class="text-xs">無提供外盒照片</p></div>`
                            }
                            <div class="absolute top-3 right-3 inline-flex items-center gap-1.5 px-3 py-1 bg-amber-500 text-white rounded-full text-xs font-bold shadow-md">
                                <i class="fa-solid fa-location-dot"></i> ${loc}
                            </div>
                        </div>

                        <div class="p-5">
                            <h3 class="font-bold text-slate-900 text-lg leading-snug mb-2 group-hover:text-indigo-600 transition-colors">${game.name}</h3>
                            <div class="flex items-center gap-4 text-xs text-slate-500 mb-4 pb-3 border-b border-slate-100">
                                <span><i class="fa-solid fa-users text-slate-400"></i> ${game.players || '未填寫'}</span>
                                <span><i class="fa-solid fa-clock text-slate-400"></i> ${game.duration || '未填寫'}</span>
                            </div>

                            ${bgCats ? `<div class="mb-3"><span class="text-[11px] font-semibold text-slate-400 uppercase block mb-1">桌遊類別</span><div class="flex flex-wrap gap-1.5">${bgCats}</div></div>` : ''}
                            ${cardCats ? `<div><span class="text-[11px] font-semibold text-slate-400 uppercase block mb-1">牌卡類別</span><div class="flex flex-wrap gap-1.5">${cardCats}</div></div>` : ''}
                        </div>
                    </div>

                    <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 flex items-center justify-between">
                        <span class="truncate pr-2"><i class="fa-solid fa-circle-info mr-1 text-slate-400"></i> ${game.notes || '點擊查看櫃位地圖'}</span>
                        <span class="text-indigo-600 font-bold shrink-0">查看櫃位 →</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 3. 開啟櫃位 Modal 彈窗與亮燈控制
    function openModal(index) {
        const game = gamesData[index];
        if (!game) return;

        document.getElementById('modal-game-name').innerText = game.name;
        document.getElementById('modal-game-location').innerText = game.location || '未標示';

        // 重置所有櫃位格子樣式
        ['A1', 'A2', 'B1', 'B2'].forEach(id => {
            const box = document.getElementById(`box-${id}`);
            if (box) {
                box.className = "border-r border-b border-black flex flex-col items-center justify-center transition-all duration-300 font-bold bg-white text-slate-800";
                box.innerHTML = `<span class="text-xl">${id}</span>`;
            }
        });

        // 當前櫃位高亮發光
        const currentLoc = (game.location || '').trim().toUpperCase();
        ['A1', 'A2', 'B1', 'B2'].forEach(id => {
            if (currentLoc.includes(id)) {
                const activeBox = document.getElementById(`box-${id}`);
                if (activeBox) {
                    activeBox.className = "border-r border-b border-black flex flex-col items-center justify-center transition-all duration-300 font-extrabold bg-amber-400 text-slate-900 shadow-inner";
                    activeBox.innerHTML = `
                        <span class="text-xl tracking-wider">${id}</span>
                        <span class="text-[10px] bg-slate-900 text-white px-2 py-0.5 rounded-full mt-1 font-normal flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-amber-400"></i> 在這裡
                        </span>
                    `;
                }
            }
        });

        // 移除 hidden，強制顯示彈窗
        document.getElementById('location-modal').classList.remove('hidden');
    }

    // 4. 關閉 Modal 彈窗
    function closeModal() {
        document.getElementById('location-modal').classList.add('hidden');
    }

    // 點擊背景空白處也可關閉 Modal
    document.getElementById('location-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // 網頁載入時自動執行
    window.onload = fetchData;
    </script>
</body>
</html>
