<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新特教 桌遊、牌卡與圖書檢索系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iansui@5.0.1/index.css">

    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }

        /* 列印專用 CSS 樣式 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            body, table, th, td, #printSection {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
                color: black !important;
                font-family: 'Iansui', serif !important;
            }
            .no-print, header, .flex.border-b, .bg-white.border, #itemCount, #loading, #gamesGrid, #mapModal, #addModal, #printModal, #backToTopBtn {
                display: none !important;
            }
            #printSection {
                display: block !important;
            }
            .print-page-break {
                page-break-after: always;
                break-after: page;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 20px;
                font-size: 14px;
            }
            th, td {
                border: 1px solid #333 !important;
                padding: 6px 8px;
                text-align: left;
            }
            th {
                background-color: #f0f0f0 !important;
                font-weight: bold;
                text-align: center;
                -webkit-print-color-adjust: exact;
            }
            .cat-cell {
                writing-mode: vertical-lr;
                text-align: center;
                vertical-align: middle;
                font-weight: bold;
                background-color: #fcfcfc !important;
                letter-spacing: 2px;
                padding: 4px;
            }
        }
    </style>
</head>
<body class="text-slate-800 p-4 sm:p-6">

    <div class="max-w-6xl mx-auto">
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-fish text-sky-500"></i>
                    鳳新特教 桌遊、牌卡與圖書檢索系統
                </h1>
                <p class="text-xs text-slate-500 mt-1">輕鬆尋找桌遊、牌卡與圖書放置位置（點擊卡片可查看對應櫃位地圖）</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openPrintModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 列印清單
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增項目
                </button>
                <button onclick="loadData()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i id="refreshIcon" class="fa-solid fa-rotate"></i> 重新整理
                </button>
            </div>
        </header>

        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button id="tab-all" onclick="switchMainTab('all')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-border-all"></i> 全部顯示
            </button>
            <button id="tab-game" onclick="switchMainTab('game')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-dice text-indigo-500"></i> 桌遊與牌卡
            </button>
            <button id="tab-book" onclick="switchMainTab('book')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-book text-amber-500"></i> 圖書
            </button>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterGames()" placeholder="搜尋名稱、作者、位置（如：A1、上層）或備註..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none text-sm transition-all">
            </div>

            <div>
                <div id="bgCatWrapper" class="mb-3">
                    <span class="text-xs font-bold text-slate-400 block mb-2">桌遊類別</span>
                    <div id="boardgameCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="cardCatWrapper" class="mb-3">
                    <span class="text-xs font-bold text-slate-400 block mb-2">牌卡類別</span>
                    <div id="cardCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="bookCatWrapper">
                    <span class="text-xs font-bold text-slate-400 block mb-2">圖書類別</span>
                    <div id="bookCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <div class="mb-4 text-xs font-bold text-slate-500">
            共找到 <span id="itemCount" class="text-indigo-600 font-extrabold text-sm">0</span> 項目
        </div>

        <div id="loading" class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-600"></i>
            <p class="text-sm">載入雲端試算表資料中...</p>
        </div>
        
        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="printSection" class="hidden"></div>

    <div id="mapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div>
                    <h2 id="modalGameName" class="text-xl font-bold text-slate-800">--</h2>
                    <p class="text-xs text-slate-500">位置：<span id="modalGameLocation" class="font-bold text-indigo-600">--</span></p>
                </div>
                <button onclick="closeMapModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">×</button>
            </div>

            <div id="boardgameMap" class="border-4 border-slate-800 bg-slate-300 p-2 rounded-lg grid grid-cols-4 gap-1 text-center font-bold hidden">
                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-r-2 border-slate-400 text-xs">其他區</div>
                <div class="col-span-2 grid grid-rows-2 gap-1 h-32">
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A1" class="bg-white flex flex-col items-center justify-center rounded">A1</div>
                        <div id="loc-B1" class="bg-white flex flex-col items-center justify-center rounded">B1</div>
                    </div>
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A2" class="bg-white flex flex-col items-center justify-center rounded">A2</div>
                        <div id="loc-B2" class="bg-white flex flex-col items-center justify-center rounded">B2</div>
                    </div>
                </div>
                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-l-2 border-slate-400 text-xs">其他區</div>
            </div>

            <div id="bookMap" class="border-4 border-slate-800 bg-slate-200 p-2 rounded-lg space-y-2 hidden">
                <div id="loc-上層" class="h-20 bg-white border-2 border-slate-300 rounded flex flex-col items-center justify-center font-bold text-slate-700">
                    上層
                </div>
                <div id="loc-下層" class="h-20 bg-white border-2 border-slate-300 rounded flex flex-col items-center justify-center font-bold text-slate-700">
                    下層
                </div>
            </div>

            <div id="weiMap" class="border-4 border-slate-800 bg-slate-100 p-4 rounded-lg flex flex-col items-center justify-center relative min-h-[220px] hidden">
                <div class="w-full max-w-[240px] border-2 border-slate-300 rounded-lg p-3 bg-white flex flex-col items-center gap-3">
                    <div class="w-full bg-amber-100 border-2 border-dashed border-amber-400 rounded-lg p-3 flex flex-col items-center justify-center text-amber-800 shadow-sm">
                        <div class="flex items-center gap-2 text-amber-600 text-2xl mb-1">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <span class="text-xs font-bold">存放於此 (座位後方)</span>
                    </div>
                    <i class="fa-solid fa-arrow-down text-slate-400 text-xs"></i>
                    <div class="w-full bg-indigo-50 border-2 border-indigo-200 rounded-lg p-2 text-center text-indigo-900 font-bold text-sm">
                        <i class="fa-solid fa-chair text-indigo-500 mr-1"></i> Wei 老師座位
                    </div>
                </div>
            </div>

            <div class="mt-5 text-center">
                <button onclick="closeMapModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-700">關閉示意圖</button>
            </div>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h2 class="text-xl font-bold text-slate-800">新增資料</h2>
                <button onclick="closeAddModal()" class="text-slate-400 text-xl">×</button>
            </div>
            
            <form onsubmit="submitNewGame(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">新增類型 *</label>
                    <select id="addItemType" onchange="toggleFormFields()" class="w-full p-2 border rounded-lg text-sm bg-slate-50 font-bold">
                        <option value="game">桌遊 / 牌卡 (寫入 Sheet1)</option>
                        <option value="book">圖書 (寫入 Sheet2)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">名稱 *</label>
                    <input type="text" id="addName" required class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div>
                    <label id="locLabel" class="block text-xs font-semibold text-slate-600 mb-1">放置位置 (如: A1, B2) *</label>
                    <input type="text" id="addLoc" required class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div id="gameFields" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">適合人數</label>
                            <input type="text" id="addPlayers" placeholder="例：3~5人" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">遊玩時間</label>
                            <input type="text" id="addDuration" placeholder="例：20分鐘" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">桌遊類別 (點選或輸入)</label>
                        <input type="text" id="addBgCats" list="listBgCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                        <datalist id="listBgCats"></datalist>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">牌卡類別 (點選或輸入)</label>
                        <input type="text" id="addCardCats" list="listCardCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                        <datalist id="listCardCats"></datalist>
                    </div>
                </div>

                <div id="bookFields" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">作者</label>
                        <input type="text" id="addAuthor" placeholder="例：被討厭的勇氣作者" class="w-full p-2 border rounded-lg text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">圖書類別 (點選或輸入)</label>
                        <input type="text" id="addBookCats" list="listBookCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                        <datalist id="listBookCats"></datalist>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">圖片網址 (可留空)</label>
                    <input type="url" id="addImageUrl" placeholder="https://script.google.com/macros/s/AKfycby-G0vv3TW8-aa2GHb7qZIwo3cFylPzWpe-flvZnEAPTAhBRMuPc2El75qt2AjG85Y-0g/exec" class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">備註 / 說明</label>
                    <input type="text" id="addNotes" class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" id="btnSubmit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">確認新增</button>
                </div>
            </form>
        </div>
    </div>

    <div id="printModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h2 class="text-xl font-bold text-slate-800">列印清單設定</h2>
                <button onclick="closePrintModal()" class="text-slate-400 text-xl">×</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">選擇欲列印的區域</label>
                    <select id="printLocSelect" class="w-full p-2 border rounded-lg text-sm bg-slate-50 font-bold">
                        <option value="ALL">全部位置 (依櫃位分頁印出)</option>
                        <option value="A1">桌遊 - A1 區</option>
                        <option value="A2">桌遊 - A2 區</option>
                        <option value="B1">桌遊 - B1 區</option>
                        <option value="B2">桌遊 - B2 區</option>
                        <option value="上層">圖書 - 上層</option>
                        <option value="下層">圖書 - 下層</option>
                    </select>
                </div>

                <div class="text-xs text-slate-500 bg-slate-50 p-3 rounded-lg leading-relaxed">
                    <p class="font-bold text-slate-700 mb-1"><i class="fa-solid fa-circle-info"></i> 列印說明：</p>
                    • 全面套用 <b>芫荽 (Iansui) 硬筆楷體</b> 字型。<br>
                    • 圖書自動按「類別」進行跨欄垂直分類顯示。<br>
                    • 紙張建議選擇 <b>A4 直向</b>。
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closePrintModal()" class="px-4 py-2 border rounded-lg text-sm">取消
