<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳新特教 桌遊、牌卡與圖書檢索系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入芫荽 (Iansui) 字型 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iansui@5.0.1/index.css">

    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }

        /* 自訂美化 Modal 滾動條（保持圓角完整） */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 列印專用 CSS 樣式 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            body, table, th, td, #printSection {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
                color: black !important;
                font-family: 'Iansui', serif !important;
            }
            .no-print, header, .flex.border-b, .bg-white.border, #itemCount, #loading, #gamesGrid, #mapModal, #addModal, #printModal, #backToTopBtn {
                display: none !important;
            }
            #printSection {
                display: block !important;
            }
            .print-page-break {
                page-break-after: always;
                break-after: page;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 20px;
                font-size: 14px;
            }
            th, td {
                border: 1px solid #333 !important;
                padding: 6px 8px;
                text-align: left;
            }
            th {
                background-color: #f0f0f0 !important;
                font-weight: bold;
                text-align: center;
                -webkit-print-color-adjust: exact;
            }
            .cat-cell {
                writing-mode: vertical-lr;
                text-align: center;
                vertical-align: middle;
                font-weight: bold;
                background-color: #fcfcfc !important;
                letter-spacing: 2px;
                padding: 4px;
            }
        }
    </style>
</head>
<body class="text-slate-800 p-4 sm:p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-fish text-sky-500"></i>
                    鳳新特教 桌遊、牌卡與圖書檢索系統
                </h1>
                <p class="text-xs text-slate-500 mt-1">輕鬆尋找桌遊、牌卡與圖書放置位置（點擊卡片可查看對應櫃位地圖與詳細資料）</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openPrintModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 列印清單
                </button>
                <button onclick="openAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增項目
                </button>
                <button onclick="loadData()" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i id="refreshIcon" class="fa-solid fa-rotate"></i> 重新整理
                </button>
            </div>
        </header>

        <!-- 主類別 Tab 分頁 -->
        <div class="flex border-b border-slate-200 mb-6 gap-2">
            <button id="tab-all" onclick="switchMainTab('all')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-border-all"></i> 全部顯示
            </button>
            <button id="tab-game" onclick="switchMainTab('game')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-dice text-blue-500"></i> 桌遊與牌卡
            </button>
            <button id="tab-book" onclick="switchMainTab('book')" class="px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-book text-amber-500"></i> 圖書
            </button>
        </div>

        <!-- Search & Category Filter Section -->
        <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm space-y-4">
            <!-- 搜尋框 -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterGames()" placeholder="搜尋名稱、作者、位置（如：A1、上層）或備註..." class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition-all">
            </div>

            <!-- 動態分類按鈕區 -->
            <div>
                <div id="bgCatWrapper" class="mb-3">
                    <span class="text-xs font-bold text-slate-400 block mb-2">桌遊類別</span>
                    <div id="boardgameCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="cardCatWrapper" class="mb-3">
                    <span class="text-xs font-bold text-slate-400 block mb-2">牌卡類別</span>
                    <div id="cardCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="bookCatWrapper">
                    <span class="text-xs font-bold text-slate-400 block mb-2">圖書類別</span>
                    <div id="bookCategoryButtons" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- 結果計數與 Data Grid -->
        <div class="mb-4 text-xs font-bold text-slate-500">
            共找到 <span id="itemCount" class="text-blue-600 font-extrabold text-sm">0</span> 項目
        </div>

        <div id="loading" class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-blue-600"></i>
            <p class="text-sm">載入雲端試算表資料中...</p>
        </div>
        
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <!-- 列印專用隱藏區域 -->
    <div id="printSection" class="hidden"></div>

    <!-- 1. 詳細資訊與櫃位示意圖 Modal -->
    <div id="mapModal" onclick="closeMapModal()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden cursor-pointer">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full flex flex-col max-h-[85vh] overflow-hidden cursor-default border border-slate-100 relative">
            
            <div class="text-center border-b pb-3 pt-6 px-6 relative shrink-0">
                <button onclick="closeMapModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold z-10">&times;</button>
                <h2 id="modalGameName" class="text-2xl font-extrabold text-slate-800 mb-1">--</h2>
                <p id="boardgameLocationSubtitle" class="text-base font-bold text-blue-600 hidden">(6F 潛能教室)</p>
                <p id="bookLocationSubtitle" class="text-base font-bold text-amber-600 hidden">(6F 資藝教室)</p>
                <p id="weiLocationSubtitle" class="text-base font-bold text-emerald-600 hidden">(葳的座位後方)</p>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4">
                <div>
                    <span class="text-xs font-bold text-slate-400 block mb-2"><i class="fa-solid fa-map-location-dot"></i> 櫃位放置位置</span>
                    
                    <div id="boardgameMap" class="border-4 border-slate-800 bg-slate-300 p-2 rounded-xl grid grid-cols-4 gap-1 text-center font-bold hidden">
                        <div class="bg-slate-300 h-28 flex items-center justify-center text-slate-400 border-r-2 border-slate-400 text-xs">其他區</div>
                        <div class="col-span-2 grid grid-rows-2 gap-1 h-28">
                            <div class="grid grid-cols-2 gap-1">
                                <div id="loc-A1" class="bg-white flex flex-col items-center justify-center rounded border-2 border-slate-300">A1</div>
                                <div id="loc-B1" class="bg-white flex flex-col items-center justify-center rounded border-2 border-slate-300">B1</div>
                            </div>
                            <div class="grid grid-cols-2 gap-1">
                                <div id="loc-A2" class="bg-white flex flex-col items-center justify-center rounded border-2 border-slate-300">A2</div>
                                <div id="loc-B2" class="bg-white flex flex-col items-center justify-center rounded border-2 border-slate-300">B2</div>
                            </div>
                        </div>
                        <div class="bg-slate-300 h-28 flex items-center justify-center text-slate-400 border-l-2 border-slate-400 text-xs">其他區</div>
                    </div>

                    <div id="bookMap" class="border-4 border-slate-800 bg-slate-200 p-2 rounded-xl space-y-2 hidden">
                        <div id="loc-上層" class="h-16 bg-white border-2 border-slate-300 rounded flex flex-col items-center justify-center font-bold text-slate-700">上層</div>
                        <div id="loc-下層" class="h-16 bg-white border-2 border-slate-300 rounded flex flex-col items-center justify-center font-bold text-slate-700">下層</div>
                    </div>

                    <div id="weiMap" class="border-4 border-slate-800 bg-slate-100 p-4 rounded-xl hidden">
                        <div class="bg-amber-400 border-2 border-amber-600 rounded-xl p-4 text-center text-amber-950 font-bold shadow-inner flex flex-col items-center justify-center">
                            <i class="fa-solid fa-box-archive text-4xl mb-1 text-amber-900"></i>
                            <span class="text-sm">葳的座位後方紙箱</span>
                            <span class="text-[10px] bg-amber-700 text-white px-2 py-0.5 rounded mt-1">放置於此</span>
                        </div>
                    </div>
                </div>

                <div id="modalDetailContent" class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm"></div>
            </div>

            <div class="p-4 border-t border-slate-100 flex justify-between items-center gap-3 bg-white shrink-0">
                <button onclick="closeMapModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition-all">關閉</button>
                <button onclick="switchToEditFromModal()" class="px-5 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-md hover:bg-blue-700 transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square"></i> 編輯此項目資訊
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 新增 / 編輯 Modal -->
    <div id="addModal" onclick="closeAddModal()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden cursor-pointer">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-xl max-w-lg w-full flex flex-col max-h-[85vh] overflow-hidden cursor-default border border-slate-100 relative">
            <div class="flex items-center justify-between border-b border-slate-100 p-6 pb-4 shrink-0">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">新增資料</h2>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold z-10">&times;</button>
            </div>
            
            <form onsubmit="submitNewGame(event)" class="flex flex-col flex-1 overflow-hidden">
                <div class="p-6 overflow-y-auto custom-scrollbar space-y-3 flex-1">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">類型 *</label>
                        <select id="addItemType" onchange="toggleFormFields()" class="w-full p-2 border rounded-lg text-sm bg-slate-50 font-bold">
                            <option value="game">桌遊 / 牌卡 (Sheet1)</option>
                            <option value="book">圖書 (Sheet2)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">名稱 *</label>
                        <input type="text" id="addName" required class="w-full p-2 border rounded-lg text-sm">
                    </div>

                    <div>
                        <label id="locLabel" class="block text-xs font-semibold text-slate-600 mb-1">放置位置 (如: A1, B2) *</label>
                        <input type="text" id="addLoc" required class="w-full p-2 border rounded-lg text-sm">
                    </div>

                    <div id="gameFields" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">適合人數</label>
                                <input type="text" id="addPlayers" placeholder="例：3~5人" class="w-full p-2 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">遊玩時間</label>
                                <input type="text" id="addDuration" placeholder="例：20分鐘" class="w-full p-2 border rounded-lg text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">桌遊類別 (點選或輸入)</label>
                            <input type="text" id="addBgCats" list="listBgCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                            <datalist id="listBgCats"></datalist>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">牌卡類別 (點選或輸入)</label>
                            <input type="text" id="addCardCats" list="listCardCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                            <datalist id="listCardCats"></datalist>
                        </div>
                    </div>

                    <div id="bookFields" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">作者</label>
                            <input type="text" id="addAuthor" placeholder="例：被討厭的勇氣作者" class="w-full p-2 border rounded-lg text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">圖書類別 (點選或輸入)</label>
                            <input type="text" id="addBookCats" list="listBookCats" placeholder="選擇或自行輸入類別..." class="w-full p-2 border rounded-lg text-sm">
                            <datalist id="listBookCats"></datalist>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">圖片網址 (可留空)</label>
                        <input type="url" id="addImageUrl" placeholder="https://..." class="w-full p-2 border rounded-lg text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備註 / 說明</label>
                        <input type="text" id="addNotes" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <div class="flex justify-end gap-2 p-4 border-t border-slate-100 bg-white shrink-0">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-slate-50">取消</button>
                    <button type="submit" id="btnSubmit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">確認儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. 列印選項 Modal -->
    <div id="printModal" onclick="closePrintModal()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden cursor-pointer">
        <div onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 cursor-default border border-slate-100">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h2 class="text-xl font-bold text-slate-800">列印清單設定</h2>
                <button onclick="closePrintModal()" class="text-slate-400 text-xl font-bold">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">選擇欲列印的區域</label>
                    <select id="printLocSelect" class="w-full p-2 border rounded-lg text-sm bg-slate-50 font-bold">
                        <option value="ALL">全部位置 (依櫃位分頁印出)</option>
                        <option value="A1">桌遊 - A1 區</option>
                        <option value="A2">桌遊 - A2 區</option>
                        <option value="B1">桌遊 - B1 區</option>
                        <option value="B2">桌遊 - B2 區</option>
                        <option value="上層">圖書 - 上層</option>
                        <option value="下層">圖書 - 下層</option>
                    </select>
                </div>

                <div class="text-xs text-slate-500 bg-slate-50 p-3 rounded-lg leading-relaxed">
                    <p class="font-bold text-slate-700 mb-1"><i class="fa-solid fa-circle-info"></i> 列印說明：</p>
                    • 全面套用 <b>芫荽 (Iansui) 硬筆楷體</b> 字型。<br>
                    • 圖書自動按「類別」進行跨欄垂直分類顯示。<br>
                    • 紙張建議選擇 <b>A4 直向</b>。
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closePrintModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-slate-50">取消</button>
                    <button type="button" onclick="executePrint()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">產生並列印</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 回到頂部懸浮按鈕 -->
    <button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-6 right-6 p-3 bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 transition-all opacity-0 pointer-events-none z-40">
        <i class="fa-solid fa-arrow-up text-lg w-5 h-5 flex items-center justify-center"></i>
    </button>

    <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx8AdDCpM1n_7JVF-rCSx1UMf7P5XfLg_tqg0-PjPjgUleD8qDzqy_a8x7SErUlAOO4_w/exec';
    let allGames = [];
    let filteredGames = [];
    let currentTab = 'all';
    let selectedBoardgameCategory = '全部類別';
    let selectedCardCategory = '全部類別';
    let selectedBookCategory = '全部類別';

    let currentActiveItem = null;

    // 分頁優化參數
    let currentPage = 1;
    const PAGE_SIZE = 24; 

    const DEFAULT_BG_CATS = ['派對遊戲', '陣營心理', '策略思考', '言語遊戲', '卡牌遊戲', '破冰歡樂', '合作解謎'];
    const DEFAULT_CARD_CATS = ['情緒表達', '自我探索', '人際溝通', '家庭關係', '職涯探索', '價值觀引導'];
    const DEFAULT_BOOK_CATS = ['翻譯文學', '心理諮商', '兩性', '家庭', '情緒', '人格潛能', '運動', '教養', '升學工作', '特教', '教育', '小說', '散文', '華文現代詩', '心靈成長', '繪本-自我認同', '繪本-生命教育', '繪本-親情/友誼', '繪本-心靈成長', '繪本-生活教育', '繪本-翻譯圖文', '繪本-其他'];

    const parseTags = (val) => {
        if (!val) return [];
        if (Array.isArray(val)) return val;
        return String(val).split(/[,/、]/).map(s => s.trim()).filter(Boolean);
    };

    function fixGoogleDriveUrl(url) {
        if (!url) return '';
        if (url.includes('drive.google.com')) {
            let fileId = '';
            const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (idMatch && idMatch[1]) {
                fileId = idMatch[1];
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
        }
        return url;
    }

    function formatNotesWithLinks(text) {
    if (!text) return '';
    const urlPattern = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlPattern, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="text-slate-500 hover:text-blue-600 active:text-blue-700 underline break-all transition-colors">${url}</a>`;
    });
}

    async function loadData() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('gamesGrid').innerHTML = '';
        document.getElementById('refreshIcon').classList.add('fa-spin');

        try {
            const res = await fetch(API_URL);
            allGames = await res.json();
            
            renderCategoryButtons();
            filterGames();
        } catch (err) {
            console.error('Data Error:', err);
            alert('資料載入失敗！');
        } finally {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('refreshIcon').classList.remove('fa-spin');
        }
    }

    function switchMainTab(tab) {
    currentTab = tab;
    
    // 設定各 Tab 被選取時對應圖示的顏色 CSS Class
    const activeClasses = {
        'all': 'border-indigo-600 text-indigo-600',
        'game': 'border-blue-600 text-blue-600',  // 寶藍色系 (與骰子同色)
        'book': 'border-amber-500 text-amber-500' // 琥珀黃色系 (與書本同色)
    };
    
    const inactiveClass = "border-transparent text-slate-500 hover:text-slate-700";
    const baseClass = "px-5 py-2.5 font-bold text-sm border-b-2 flex items-center gap-2 transition-all";

    ['all', 'game', 'book'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
            btn.className = `${baseClass} ${activeClasses[t]}`;
        } else {
            btn.className = `${baseClass} ${inactiveClass}`;
        }
    });

    document.getElementById('bgCatWrapper').style.display = (tab === 'all' || tab === 'game') ? 'block' : 'none';
    document.getElementById('cardCatWrapper').style.display = (tab === 'all' || tab === 'game') ? 'block' : 'none';
    document.getElementById('bookCatWrapper').style.display = (tab === 'all' || tab === 'book') ? 'block' : 'none';

    filterGames();
}

    function renderCategoryButtons() {
    const dynamicBgCats = new Set(DEFAULT_BG_CATS);
    const dynamicCardCats = new Set(DEFAULT_CARD_CATS);
    const dynamicBookCats = new Set(DEFAULT_BOOK_CATS);

    allGames.forEach(g => {
        parseTags(g.boardgameCategories).forEach(t => dynamicBgCats.add(t));
        parseTags(g.cardCategories).forEach(t => dynamicCardCats.add(t));
        parseTags(g.bookCategories).forEach(t => dynamicBookCats.add(t));
    });

    // 桌遊類別：選取狀態改為寶藍色 bg-blue-600
    document.getElementById('boardgameCategoryButtons').innerHTML = ['全部類別', ...dynamicBgCats].map(cat => {
        const active = selectedBoardgameCategory === cat;
        return `<button onclick="selectCat('bg', '${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${active ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${cat}</button>`;
    }).join('');

    document.getElementById('cardCategoryButtons').innerHTML = ['全部類別', ...dynamicCardCats].map(cat => {
        const active = selectedCardCategory === cat;
        return `<button onclick="selectCat('card', '${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${active ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${cat}</button>`;
    }).join('');

    document.getElementById('bookCategoryButtons').innerHTML = ['全部類別', ...dynamicBookCats].map(cat => {
        const active = selectedBookCategory === cat;
        return `<button onclick="selectCat('book', '${cat}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${active ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${cat}</button>`;
    }).join('');

    document.getElementById('listBgCats').innerHTML = Array.from(dynamicBgCats).map(cat => `<option value="${cat}">`).join('');
    document.getElementById('listCardCats').innerHTML = Array.from(dynamicCardCats).map(cat => `<option value="${cat}">`).join('');
    document.getElementById('listBookCats').innerHTML = Array.from(dynamicBookCats).map(cat => `<option value="${cat}">`).join('');
}

    function selectCat(type, cat) {
        if (type === 'bg') selectedBoardgameCategory = cat;
        if (type === 'card') selectedCardCategory = cat;
        if (type === 'book') selectedBookCategory = cat;
        renderCategoryButtons();
        filterGames();
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();

        filteredGames = allGames.filter(g => {
            const isBook = g.type === 'book' || (g.location || '').includes('層');

            if (currentTab === 'game' && isBook) return false;
            if (currentTab === 'book' && !isBook) return false;

            const name = (g.name || '').toLowerCase();
            const author = (g.author || '').toLowerCase();
            const loc = (g.location || '').toLowerCase();
            const notes = (g.notes || '').toLowerCase();

            const bgTags = parseTags(g.boardgameCategories);
            const cardTags = parseTags(g.cardCategories);
            const bookTags = parseTags(g.bookCategories);

            const matchQuery = !query || name.includes(query) || author.includes(query) || loc.includes(query) || notes.includes(query);
            const matchBgCat = selectedBoardgameCategory === '全部類別' || bgTags.includes(selectedBoardgameCategory);
            const matchCardCat = selectedCardCategory === '全部類別' || cardTags.includes(selectedCardCategory);
            const matchBookCat = selectedBookCategory === '全部類別' || bookTags.includes(selectedBookCategory);

            return matchQuery && matchBgCat && matchCardCat && matchBookCat;
        });

        document.getElementById('itemCount').textContent = filteredGames.length;
        
        // 重設頁碼，重新渲染第一頁
        currentPage = 1;
        document.getElementById('gamesGrid').innerHTML = '';
        renderNextBatch();
    }

    function renderNextBatch() {
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = currentPage * PAGE_SIZE;
        const itemsToRender = filteredGames.slice(start, end);

        if (itemsToRender.length > 0) {
            renderCards(itemsToRender);
            currentPage++;
        }
    }

    function renderCards(games) {
        const grid = document.getElementById('gamesGrid');

        games.forEach((game) => {
            const name = game.name || '未命名項目';
            const author = game.author || '';
            const location = game.location || '未標示';
            const players = game.players || '';
            const duration = game.duration || '';
            const notes = game.notes || '';
            
            const rawImageUrl = (game.imageUrl || game.image || game.photo || game.img || '').trim();
            const imageUrl = fixGoogleDriveUrl(rawImageUrl);
            
            const isBook = game.type === 'book' || location.includes('層');

            const bgTags = parseTags(game.boardgameCategories);
            const cardTags = parseTags(game.cardCategories);
            const bookTags = parseTags(game.bookCategories);

            const bgCatHtml = bgTags.length ? `
    <div class="mb-2">
        <span class="text-[11px] font-semibold text-slate-400 block mb-1">桌遊類別</span>
        <div class="flex flex-wrap gap-1">${bgTags.map(t => `<span class="px-2 py-0.5 bg-blue-100 text-blue-600 rounded text-xs font-medium">${t}</span>`).join('')}</div>
    </div>` : '';

            const cardCatHtml = cardTags.length ? `
                <div class="mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 block mb-1">牌卡類別</span>
                    <div class="flex flex-wrap gap-1">${cardTags.map(t => `<span class="px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded text-xs font-medium">${t}</span>`).join('')}</div>
                </div>` : '';

            const bookCatHtml = bookTags.length ? `
                <div class="mb-2">
                    <span class="text-[11px] font-semibold text-slate-400 block mb-1">圖書類別</span>
                    <div class="flex flex-wrap gap-1">${bookTags.map(t => `<span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded text-xs font-medium">${t}</span>`).join('')}</div>
                </div>` : '';

            const imageArea = imageUrl ? 
                `<img src="${imageUrl}" alt="${name}" class="w-full h-44 object-contain bg-slate-100 p-2" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-44 bg-slate-100 flex flex-col items-center justify-center text-slate-400\\'><i class=\\'fa-solid fa-image-slash text-3xl mb-1 text-slate-300\\'></i><span class=\\'text-xs font-medium\\'>圖片載入失敗</span></div>';">` : 
                `<div class="w-full h-44 bg-slate-100 flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid ${isBook ? 'fa-book' : 'fa-box-archive'} text-3xl mb-1 text-slate-300"></i>
                    <span class="text-xs font-medium">無提供照片</span>
                 </div>`;

            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all overflow-hidden cursor-pointer flex flex-col justify-between group";
            
            card.innerHTML = `
                <div>
                    <div class="relative">
                        ${imageArea}
                        <span class="absolute top-3 right-3 px-2.5 py-1 bg-white/90 backdrop-blur-sm text-amber-800 border border-amber-200 rounded-md text-xs font-bold shadow-sm">
                            <i class="fa-solid fa-location-dot text-amber-600"></i> ${location}
                        </span>
                    </div>

                    <div class="p-5">
                        <h3 class="font-bold text-slate-900 text-lg mb-1 leading-snug">${name}</h3>
                        ${author ? `<p class="text-xs font-medium text-slate-500 mb-3"><i class="fa-solid fa-user-pen text-slate-400 mr-1"></i>${author}</p>` : ''}

                        ${(players || duration) ? `
                        <div class="flex items-center gap-3 text-xs text-slate-500 mb-3 pb-2 border-b border-slate-100">
                            ${players ? `<span><i class="fa-solid fa-users"></i> ${players}</span>` : ''}
                            ${duration ? `<span><i class="fa-solid fa-clock"></i> ${duration}</span>` : ''}
                        </div>` : ''}

                        ${bgCatHtml}
                        ${cardCatHtml}
                        ${bookCatHtml}
                    </div>
                </div>
                ${notes ? `<div class="px-5 py-2.5 bg-slate-50 border-t text-xs text-slate-500 break-all">${formatNotesWithLinks(notes)}</div>` : ''}
            `;

            card.onclick = () => openMapModal(game);
            grid.appendChild(card);
        });
    }

    /* ----- 列印功能相關邏輯 ----- */
    function openPrintModal() { document.getElementById('printModal').classList.remove('hidden'); }
    function closePrintModal() { document.getElementById('printModal').classList.add('hidden'); }

    function generateBookCategoryHtml(items) {
        const catMap = {};
        items.forEach(item => {
            const cats = parseTags(item.bookCategories);
            const primaryCat = cats.length > 0 ? cats[0] : '其他/未分類';
            if (!catMap[primaryCat]) catMap[primaryCat] = [];
            catMap[primaryCat].push(item);
        });

        let html = `<table>
            <thead>
                <tr>
                    <th style="width: 25%;">類別</th>
                    <th style="width: 75%;">圖書名稱</th>
                </tr>
            </thead>
            <tbody>`;

        const catNames = Object.keys(catMap);
        if (catNames.length === 0) {
            html += `<tr><td colspan="2" style="text-align: center; color: #888;">(尚無資料)</td></tr>`;
        } else {
            catNames.forEach(catName => {
                const list = catMap[catName];
                list.forEach((book, idx) => {
                    html += `<tr>`;
                    if (idx === 0) {
                        html += `<td rowspan="${list.length}" class="cat-cell">${catName}</td>`;
                    }
                    html += `<td style="font-weight: 500;">${book.name || ''}</td></tr>`;
                });
            });
        }

        html += `</tbody></table>`;
        return html;
    }

    function generateStandardTwoColumnHtml(items, titleName) {
        const mid = Math.ceil(items.length / 2);
        const leftList = items.slice(0, mid);
        const rightList = items.slice(mid);
        const rowCount = Math.max(leftList.length, rightList.length);

        let tableRows = '';
        for (let i = 0; i < rowCount; i++) {
            const leftName = leftList[i] ? leftList[i].name : '';
            const rightName = rightList[i] ? rightList[i].name : '';
            tableRows += `
                <tr>
                    <td style="width: 50%; font-weight: 500;">${leftName}</td>
                    <td style="width: 50%; font-weight: 500;">${rightName}</td>
                </tr>
            `;
        }

        if (rowCount === 0) {
            tableRows = `<tr><td style="width: 50%; text-align: center; color: #888;">(尚無資料)</td><td style="width: 50%;"></td></tr>`;
        }

        return `
            <table>
                <thead>
                    <tr>
                        <th>${titleName}</th>
                        <th>${titleName}</th>
                    </tr>
                </thead>
                <tbody>${tableRows}</tbody>
            </table>
        `;
    }

    function executePrint() {
        const targetLoc = document.getElementById('printLocSelect').value;
        const printSec = document.getElementById('printSection');
        printSec.innerHTML = '';

        const locations = (targetLoc === 'ALL') ? ['A1', 'A2', 'B1', 'B2', '上層', '下層'] : [targetLoc];

        locations.forEach((loc, idx) => {
            const items = allGames.filter(g => (g.location || '').toUpperCase().includes(loc));
            if (items.length === 0 && targetLoc !== 'ALL') return;

            const isBook = loc === '上層' || loc === '下層';
            const typeTitle = isBook ? '圖書列表' : '桌遊與牌卡列表';

            let contentTableHtml = isBook ? generateBookCategoryHtml(items) : generateStandardTwoColumnHtml(items, '桌遊品名');

            const pageDiv = document.createElement('div');
            pageDiv.className = (idx < locations.length - 1) ? 'print-page-break' : '';
            pageDiv.innerHTML = `
                <div style="margin-bottom: 12px; border-bottom: 2px solid #000; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <h2 style="font-size: 18px; font-weight: bold; margin: 0;">櫃位名稱：[ ${loc} ] ${typeTitle}</h2>
                    <span style="font-size: 12px; color: #555;">共 ${items.length} 項</span>
                </div>
                ${contentTableHtml}
            `;
            printSec.appendChild(pageDiv);
        });

        closePrintModal();
        setTimeout(() => {
            window.print();
        }, 300);
    }

    /* Modal & Form Helpers */
    function toggleFormFields() {
        const type = document.getElementById('addItemType').value;
        const gameFields = document.getElementById('gameFields');
        const bookFields = document.getElementById('bookFields');
        const locLabel = document.getElementById('locLabel');

        if (type === 'book') {
            gameFields.classList.add('hidden');
            bookFields.classList.remove('hidden');
            locLabel.textContent = '放置位置 (如: 上層, 下層) *';
        } else {
            gameFields.classList.remove('hidden');
            bookFields.classList.add('hidden');
            locLabel.textContent = '放置位置 (如: A1, B2) *';
        }
    }

    function openMapModal(game) {
        currentActiveItem = game;

        const name = game.name || '未命名項目';
        const location = game.location || '未標示';
        const isBook = game.type === 'book' || location.includes('層');

        document.getElementById('modalGameName').textContent = name;

        const bgMap = document.getElementById('boardgameMap');
        const bookMap = document.getElementById('bookMap');
        const weiMap = document.getElementById('weiMap');

        const bgSub = document.getElementById('boardgameLocationSubtitle');
        const bookSub = document.getElementById('bookLocationSubtitle');
        const weiSub = document.getElementById('weiLocationSubtitle');

        [bgMap, bookMap, weiMap, bgSub, bookSub, weiSub].forEach(el => el.classList.add('hidden'));

        const rawLoc = String(location || '').toUpperCase();

        if (rawLoc.includes('WEI') || rawLoc.includes('座位') || rawLoc.includes('後方')) {
            weiMap.classList.remove('hidden');
            weiSub.classList.remove('hidden');
        } 
        else if (isBook) {
            bookMap.classList.remove('hidden');
            bookSub.classList.remove('hidden');

            ['上層', '下層'].forEach(loc => {
                const el = document.getElementById(`loc-${loc}`);
                if (location.includes(loc)) {
                    el.className = "h-16 bg-amber-400 text-amber-950 font-bold border-2 border-amber-600 rounded flex flex-col items-center justify-center text-sm shadow-inner";
                    el.innerHTML = `${loc} <span class="text-[10px] bg-amber-700 text-white px-2 py-0.5 rounded mt-0.5">在這裡!</span>`;
                } else {
                    el.className = "h-16 bg-white border-2 border-slate-300 rounded flex items-center justify-center font-bold text-slate-500";
                    el.innerHTML = loc;
                }
            });
        } 
        else {
            bgMap.classList.remove('hidden');
            bgSub.classList.remove('hidden');

            ['A1', 'A2', 'B1', 'B2'].forEach(loc => {
                const el = document.getElementById(`loc-${loc}`);
                if (rawLoc.includes(loc)) {
                    el.className = "bg-amber-400 text-amber-950 font-bold border-2 border-amber-600 shadow-inner flex flex-col items-center justify-center rounded text-xs";
                    el.innerHTML = `${loc}<span class="text-[9px] bg-amber-600 text-white px-1.5 rounded mt-0.5">在這裡!</span>`;
                } else {
                    el.className = "bg-white text-slate-700 flex items-center justify-center rounded border-2 border-slate-300";
                    el.innerHTML = loc;
                }
            });
        }

        const bgTags = parseTags(game.boardgameCategories);
        const cardTags = parseTags(game.cardCategories);
        const bookTags = parseTags(game.bookCategories);

        let detailHtml = `
            <div><span class="text-slate-400 font-bold">放置位置：</span><span class="font-extrabold text-amber-700">${location}</span></div>
        `;
        if (game.author) detailHtml += `<div><span class="text-slate-400 font-bold">作者：</span>${game.author}</div>`;
        if (game.players) detailHtml += `<div><span class="text-slate-400 font-bold">適合人數：</span>${game.players}</div>`;
        if (game.duration) detailHtml += `<div><span class="text-slate-400 font-bold">遊玩時間：</span>${game.duration}</div>`;
        if (bgTags.length) detailHtml += `<div><span class="text-slate-400 font-bold block mb-1">桌遊類別：</span><div class="flex flex-wrap gap-1">${bgTags.map(t=>`<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs font-medium">${t}</span>`).join('')}</div></div>`;
        if (cardTags.length) detailHtml += `<div><span class="text-slate-400 font-bold block mb-1">牌卡類別：</span><div class="flex flex-wrap gap-1">${cardTags.map(t=>`<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-medium">${t}</span>`).join('')}</div></div>`;
        if (bookTags.length) detailHtml += `<div><span class="text-slate-400 font-bold block mb-1">圖書類別：</span><div class="flex flex-wrap gap-1">${bookTags.map(t=>`<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-medium">${t}</span>`).join('')}</div></div>`;
        if (game.notes) detailHtml += `<div class="pt-2 border-t border-slate-200"><span class="text-slate-400 font-bold block mb-1">備註 / 說明：</span><div class="text-slate-600 break-all">${formatNotesWithLinks(game.notes)}</div></div>`;

        document.getElementById('modalDetailContent').innerHTML = detailHtml;
        document.getElementById('mapModal').classList.remove('hidden');
    }

    function closeMapModal() { document.getElementById('mapModal').classList.add('hidden'); }

    function switchToEditFromModal() {
        if (!currentActiveItem) return;
        const item = currentActiveItem;
        closeMapModal();
        openEditModal(item);
    }

    function openAddModal() { 
        currentActiveItem = null;
        document.getElementById('modalTitle').textContent = '新增資料';
        document.getElementById('btnSubmit').textContent = '確認新增';
        
        document.getElementById('addName').value = '';
        document.getElementById('addLoc').value = '';
        document.getElementById('addAuthor').value = '';
        document.getElementById('addPlayers').value = '';
        document.getElementById('addDuration').value = '';
        document.getElementById('addBgCats').value = '';
        document.getElementById('addCardCats').value = '';
        document.getElementById('addBookCats').value = '';
        document.getElementById('addImageUrl').value = '';
        document.getElementById('addNotes').value = '';
        
        renderCategoryButtons(); 
        toggleFormFields();
        document.getElementById('addModal').classList.remove('hidden'); 
    }

    function openEditModal(item) {
        currentActiveItem = item;

        document.getElementById('modalTitle').textContent = '編輯資料';
        document.getElementById('btnSubmit').textContent = '確認修改';

        document.getElementById('addItemType').value = item.type || 'game';
        document.getElementById('addName').value = item.name || '';
        document.getElementById('addLoc').value = item.location || '';
        document.getElementById('addAuthor').value = item.author || '';
        document.getElementById('addPlayers').value = item.players || '';
        document.getElementById('addDuration').value = item.duration || '';
        document.getElementById('addBgCats').value = item.boardgameCategories || '';
        document.getElementById('addCardCats').value = item.cardCategories || '';
        document.getElementById('addBookCats').value = item.bookCategories || '';
        document.getElementById('addImageUrl').value = item.imageUrl || '';
        document.getElementById('addNotes').value = item.notes || '';

        renderCategoryButtons();
        toggleFormFields();
        document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() { 
        document.getElementById('addModal').classList.add('hidden'); 
        currentActiveItem = null;
    }

    async function submitNewGame(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = '寫入雲端中...';

        const itemType = document.getElementById('addItemType').value;

        const payload = {
            action: currentActiveItem ? 'update' : 'add',
            rowIndex: currentActiveItem ? currentActiveItem.rowIndex : null,
            itemType: itemType,
            name: document.getElementById('addName').value,
            author: document.getElementById('addAuthor').value,
            location: document.getElementById('addLoc').value,
            players: document.getElementById('addPlayers').value,
            duration: document.getElementById('addDuration').value,
            boardgameCategories: document.getElementById('addBgCats').value,
            cardCategories: document.getElementById('addCardCats').value,
            bookCategories: document.getElementById('addBookCats').value,
            imageUrl: document.getElementById('addImageUrl').value,
            notes: document.getElementById('addNotes').value
        };

        try {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            alert(currentActiveItem ? '修改成功！' : '新增成功！');
            closeAddModal();
            loadData();
        } catch (err) {
            alert('操作失敗！請檢查網路或 Apps Script 權限。');
        } finally {
            btn.disabled = false;
            btn.innerText = '確認儲存';
        }
    }

    // 滾動事件：控制回到頂部按鈕 + 滑到底部自動載入下一頁卡片
    window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTopBtn');
        if (window.scrollY > 300) {
            btn.classList.remove('opacity-0', 'pointer-events-none');
            btn.classList.add('opacity-100');
        } else {
            btn.classList.add('opacity-0', 'pointer-events-none');
            btn.classList.remove('opacity-100');
        }

        // 滑動距底部小於 200px 時載入下一批卡片
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
            renderNextBatch();
        }
    });

    loadData();
</script>
