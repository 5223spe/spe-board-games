<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室桌遊與卡牌檢索系統</title>
    <!-- Tailwind CSS (負責畫面樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons (負責圖示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="text-slate-800 p-4 sm:p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-dice-d20 text-indigo-600"></i>
                    辦公室桌遊與卡牌檢索系統
                </h1>
                <p class="text-xs text-slate-500 mt-1">輕鬆尋找桌遊與牌卡放置位置（點擊卡片可查看櫃位地圖）</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openAddModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新增桌遊
                </button>
                <button onclick="loadData()" class="px-4 py-2 bg-white border rounded-lg text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-medium flex items-center gap-2">
                    <i id="refreshIcon" class="fa-solid fa-rotate"></i> 重新整理
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="mb-6">
            <input type="text" id="searchInput" oninput="filterGames()" placeholder="搜尋桌遊名稱或位置（如：A1、B2）..." class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        </div>

        <!-- Data Grid & Loading -->
        <div id="loading" class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-indigo-600"></i>
            <p class="text-sm">載入雲端試算表資料中...</p>
        </div>
        
        <div id="gamesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 1. 櫃位示意圖 Modal -->
    <div id="mapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div>
                    <h2 id="modalGameName" class="text-xl font-bold text-slate-800">--</h2>
                    <p class="text-xs text-slate-500">試算表登記位置：<span id="modalGameLocation" class="font-bold text-indigo-600">--</span></p>
                </div>
                <button onclick="closeMapModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
            </div>

            <!-- 櫃子示意圖 -->
            <div class="border-4 border-slate-800 bg-slate-300 p-2 rounded-lg grid grid-cols-4 gap-1 text-center font-bold">
                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-r-2 border-slate-400 text-xs">其他區</div>
                
                <div class="col-span-2 grid grid-rows-2 gap-1 h-32">
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A1" class="bg-white flex flex-col items-center justify-center rounded">A1</div>
                        <div id="loc-B1" class="bg-white flex flex-col items-center justify-center rounded">B1</div>
                    </div>
                    <div class="grid grid-cols-2 gap-1">
                        <div id="loc-A2" class="bg-white flex flex-col items-center justify-center rounded">A2</div>
                        <div id="loc-B2" class="bg-white flex flex-col items-center justify-center rounded">B2</div>
                    </div>
                </div>

                <div class="bg-slate-300 h-32 flex items-center justify-center text-slate-400 border-l-2 border-slate-400 text-xs">其他區</div>
            </div>

            <div class="mt-5 text-center">
                <button onclick="closeMapModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg text-sm hover:bg-slate-700">關閉示意圖</button>
            </div>
        </div>
    </div>

    <!-- 2. 新增桌遊 Modal -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <h2 class="text-xl font-bold text-slate-800">新增桌遊 / 牌卡</h2>
                <button onclick="closeAddModal()" class="text-slate-400 text-xl">&times;</button>
            </div>
            <form onsubmit="submitNewGame(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">名稱 *</label>
                    <input type="text" id="addName" required class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">位置 (如：A1、B2) *</label>
                    <input type="text" id="addLoc" required class="w-full p-2 border rounded text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded text-sm">取消</button>
                    <button type="submit" id="btnSubmit" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm">確認新增</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 (無 Vue 依賴) -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwtas6wDz1YWgfQ0nDI3D6aJf2x5Pt5eFvYSyxDIMf4MEZqn1eLH4akAodhRHPqzHSItA/exec';
        let allGames = [];

        // 1. 抓取 API 資料
        async function loadData() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('gamesGrid').innerHTML = '';
            document.getElementById('refreshIcon').classList.add('fa-spin');

            try {
                const res = await fetch(API_URL);
                allGames = await res.json();
                renderCards(allGames);
            } catch (err) {
                alert('資料載入失敗！');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('refreshIcon').classList.remove('fa-spin');
            }
        }

        // 2. 渲染桌遊卡片
        function renderCards(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all overflow-hidden cursor-pointer p-5 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        ${game.imageUrl 
                            ? `<div class="w-full h-48 mb-3 overflow-hidden rounded-lg bg-slate-100 flex items-center justify-center">
                                 <img src="${game.imageUrl}" alt="${game.name}" class="w-full h-full object-cover">
                               </div>`
                            : ''
                        }
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-slate-900 text-lg">${game.name}</h3>
                            <span class="px-2 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded text-xs font-bold">
                                <i class="fa-solid fa-location-dot text-amber-500"></i> ${game.location || '未標示'}
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 mb-2">適合人數：${game.players || '未填'}</p>
                    </div>
                    <div class="pt-3 border-t text-xs text-indigo-600 font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-map-location-dot"></i> 點擊查看櫃位地圖
                    </div>
                `;

                // 綁定點擊事件 -> 開啟櫃位地圖 Modal
                card.onclick = () => openMapModal(game);
                grid.appendChild(card);
            });
        }

        // 3. 打開櫃位地圖
        function openMapModal(game) {
            document.getElementById('modalGameName').textContent = game.name;
            document.getElementById('modalGameLocation').textContent = game.location || '未標示';

            const rawLoc = (game.location || '').toUpperCase();
            ['A1', 'A2', 'B1', 'B2'].forEach(loc => {
                const el = document.getElementById(`loc-${loc}`);
                if (rawLoc.includes(loc)) {
                    el.className = "bg-amber-400 text-amber-950 font-bold border-2 border-amber-600 shadow-inner flex flex-col items-center justify-center rounded text-xs";
                    el.innerHTML = `${loc}<span class="text-[9px] bg-amber-600 text-white px-1.5 rounded mt-0.5">在這裡!</span>`;
                } else {
                    el.className = "bg-white text-slate-700 flex items-center justify-center rounded";
                    el.innerHTML = loc;
                }
            });

            document.getElementById('mapModal').classList.remove('hidden');
        }

        function closeMapModal() {
            document.getElementById('mapModal').classList.add('hidden');
        }

        // 4. 搜尋功能
        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allGames.filter(g => 
                (g.name && g.name.toLowerCase().includes(query)) ||
                (g.location && g.location.toLowerCase().includes(query))
            );
            renderCards(filtered);
        }

        // 5. 新增桌遊
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        async function submitNewGame(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = '寫入中...';

            const payload = {
                name: document.getElementById('addName').value,
                location: document.getElementById('addLoc').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                alert('新增成功！');
                closeAddModal();
                loadData();
            } catch (err) {
                alert('新增失敗！');
            } finally {
                btn.disabled = false;
                btn.innerText = '確認新增';
            }
        }

        // 初次開啟頁面載入資料
        loadData();
    </script>
</body>
</html>
